name: Build ImmortalWrt-MT798x

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-24.10-6.6

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    # ----------------------------
    # Install ALL build deps
    # From official ImmortalWrt doc
    # ----------------------------
    - name: Install build dependencies
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

    # ----------------------------
    # Cache DL & build_dir
    # ----------------------------
    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-${{ hashFiles('feeds.conf', 'feeds.conf.default') }}

    - name: Cache build_dir
      uses: actions/cache@v4
      with:
        path: |
          build_dir/toolchain
          build_dir/host
        key: build-${{ github.sha }}

    # ----------------------------
    # Feeds
    # ----------------------------
    - name: Update feeds
      run: ./scripts/feeds update -a

    - name: Install feeds
      run: ./scripts/feeds install -a

    # ----------------------------
    # MT7981 defconfig 自动复制
    # ----------------------------
    - name: Use H3C NX30 Pro NMBM Layout config
      run: |
        cp -f defconfig/h3c_magic-nx30-pro-nmbm.config .config
        echo "Using H3C NX30 Pro NMBM Layout config"

    # ----------------------------
    # Compile firmware
    # ----------------------------
    - name: Compile firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    # ----------------------------
    # 上传固件
    # ----------------------------
    - name: Upload sysupgrade
      uses: actions/upload-artifact@v4
      with:
        name: sysupgrade
        path: immortalwrt-mediatek-filogic-h3c_magic-nx30-pro-nmbm-squashfs-sysupgrade.bin
    
    - name: Upload factory
      uses: actions/upload-artifact@v4
      with:
        name: factory
        path: immortalwrt-mediatek-filogic-h3c_magic-nx30-pro-nmbm-squashfs-factory.bin
  
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        files: |
          bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-h3c_magic-nx30-pro-nmbm-*.bin
